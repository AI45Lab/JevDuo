[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-desktop"
version = "0.1.0"
description = "An injectable Jev decision loop for native desktop tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
jev-desktop = "jev_desktop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
