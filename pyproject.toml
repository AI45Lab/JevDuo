[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevduo-cluster"
version = "0.1.0"
description = "JevDuo 集群测评：OSWorld 2.1 × 上游 CUA harness（rjob 链路）"
requires-python = ">=3.12"
# 开发机侧（pool/settings）序列化配置；worker 侧不依赖本包
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/upstream/**" = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
